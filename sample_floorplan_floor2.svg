<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow filter for pins and cards -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#0f172a">Room Finder: 2D Floor Plan Example (Floor 2)</text>
  <text x="30" y="62" font-size="13" fill="#64748b">Building B - Floor 2 | Active Route: Continued from Floor 1 Stairs → Room B-201</text>

  <!-- Outer Building Boundary (Exact same shape & position as Floor 1) -->
  <rect x="50" y="80" width="700" height="340" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />

  <!-- Corridors (Light Gray Background) -->
  <path d="M 70 230 L 730 230 L 730 330 L 70 330 Z" fill="#f1f5f9" />
  <!-- Enclosed West Corridor on Floor 2 -->
  <path d="M 70 330 L 220 330 L 220 400 L 70 400 Z" fill="#f1f5f9" />

  <!-- ROOMS ON TOP (Floor 2 Classrooms) -->
  <!-- Room B-203 (West End) -->
  <rect x="70" y="100" width="180" height="130" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="160" y="165" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Room B-203</text>
  <text x="160" y="185" font-size="11" fill="#64748b" text-anchor="middle">CHEM101-L (Curie)</text>
  <!-- Doorway B-203 -->
  <line x1="140" y1="230" x2="180" y2="230" stroke="#f1f5f9" stroke-width="3" />

  <!-- Room B-202 (Middle Room) -->
  <rect x="270" y="100" width="190" height="130" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="365" y="165" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Room B-202</text>
  <text x="365" y="185" font-size="11" fill="#64748b" text-anchor="middle">ENG105-C (Shelley)</text>
  <!-- Doorway B-202 -->
  <line x1="345" y1="230" x2="385" y2="230" stroke="#f1f5f9" stroke-width="3" />

  <!-- Room B-201 (Target Destination Room Highlighted) -->
  <rect x="480" y="100" width="160" height="130" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="560" y="165" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Room B-201 ★</text>
  <text x="560" y="185" font-size="11" fill="#3b82f6" text-anchor="middle">CS204-A (Knuth)</text>
  <!-- Doorway B-201 -->
  <line x1="540" y1="230" x2="580" y2="230" stroke="#f1f5f9" stroke-width="3" />
  <line x1="540" y1="230" x2="560" y2="215" stroke="#2563eb" stroke-width="2" stroke-dasharray="2,2" />

  <!-- East Staircase (Connected from Floor 1 in the Exact Same Position!) -->
  <rect x="660" y="100" width="70" height="230" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <!-- Stair Step Lines -->
  <line x1="660" y1="130" x2="730" y2="130" stroke="#93c5fd" stroke-width="1.5" />
  <line x1="660" y1="160" x2="730" y2="160" stroke="#93c5fd" stroke-width="1.5" />
  <line x1="660" y1="190" x2="730" y2="190" stroke="#93c5fd" stroke-width="1.5" />
  <line x1="660" y1="220" x2="730" y2="220" stroke="#93c5fd" stroke-width="1.5" />
  <line x1="660" y1="250" x2="730" y2="250" stroke="#93c5fd" stroke-width="1.5" />
  <text x="695" y="280" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">STAIRS</text>
  <text x="695" y="295" font-size="9" fill="#1d4ed8" text-anchor="middle">From Floor 1</text>

  <!-- Restrooms / Faculty Lounge on Floor 2 -->
  <rect x="270" y="330" width="190" height="70" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text x="365" y="370" font-size="13" fill="#64748b" text-anchor="middle">Faculty Lounge</text>

  <!-- Study Area on West Side -->
  <rect x="70" y="330" width="150" height="70" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text x="145" y="370" font-size="13" fill="#64748b" text-anchor="middle">Study Area</text>

  <!-- NAVIGATION ROUTE LINE (Continues From Stairs across Floor 2) -->
  <!-- Segment: Exits the East Stairs and walks directly west to Room B-201 door -->
  <path d="M 660 280 L 560 280 L 560 235" 
        fill="none" 
        stroke="#2563eb" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- START PIN: "Arrived from Stairs" (Green) -->
  <g transform="translate(660, 280)" filter="url(#drop-shadow)">
    <circle cx="0" cy="0" r="14" fill="#16a34a" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <rect x="-75" y="-42" width="150" height="24" rx="4" fill="#15803d" />
    <text x="0" y="-26" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">📍 Arrived from Stairs</text>
  </g>

  <!-- DESTINATION PIN: Room B-201 (Red) -->
  <g transform="translate(560, 220)" filter="url(#drop-shadow)">
    <circle cx="0" cy="0" r="14" fill="#dc2626" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <rect x="-65" y="-42" width="130" height="24" rx="4" fill="#b91c1c" />
    <text x="0" y="-26" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">🎯 Room B-201</text>
  </g>

  <!-- Floor 1 / Floor 2 Switcher simulation banner (Top Right) -->
  <g transform="translate(560, 490)">
    <rect x="-70" y="-70" width="220" height="34" rx="17" fill="#1e293b" />
    <text x="-40" y="-48" font-size="11" fill="#94a3b8">Floor 1</text>
    <rect x="0" y="-66" width="70" height="26" rx="13" fill="#2563eb" />
    <text x="35" y="-49" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Floor 2 ✓</text>
  </g>

  <!-- Legend Box (Bottom Left) -->
  <g transform="translate(70, 425)">
    <rect x="0" y="0" width="280" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="16" cy="25" r="5" fill="#16a34a" />
    <text x="26" y="29" font-size="10" fill="#334155">Stairs Exit (Start)</text>

    <line x1="115" y1="25" x2="135" y2="25" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
    <text x="142" y="29" font-size="10" fill="#334155">Route Path</text>

    <circle cx="210" cy="25" r="5" fill="#dc2626" />
    <text x="220" y="29" font-size="10" fill="#334155">Room B-201</text>
  </g>

</svg>

